spring.application.name=cineclick-backend

# Perfil por defecto: demo (siembra los datos de prueba). Los tests usan el perfil test, sin seed.
spring.profiles.default=demo
server.port=8080

spring.datasource.url=jdbc:h2:file:./data/cineclick;DATABASE_TO_LOWER=TRUE;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web de H2 para ver tablas y datos: http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
# true muestra en la consola cada consulta SQL (util para estudiar, pero hace lento el primer arranque con el seed)
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

server.error.include-message=never
server.error.include-stacktrace=never

cineclick.funciones.minutos-limpieza=20

cineclick.funciones.minutos-publicidad=15
cineclick.combinables.margen-minutos=10
cineclick.combinables.ventana-horas=3
cineclick.limite.pedidos-por-minuto=20

cineclick.ingreso.minutos-antes=60
cineclick.ingreso.minutos-despues=30

# Datos de demo: misma semilla = mismos datos para todos (las fechas son relativas al dia de arranque)
cineclick.demo.semilla=20261101
